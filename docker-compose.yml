# All ports bind to localhost: /generate has no auth and can spend fal credit.
services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SEMCONV_STABILITY_OPT_IN: http
    volumes:
      - budget:/data
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Only runs on request (`make load`), so `docker compose up` never spends credit.
  loadgen:
    profiles: ["load"]
    build: .
    command:
      - python
      - -m
      - fal_telemetry.loadgen
      - --url=http://app:8000/generate
      - --total=${LOAD_TOTAL:-30}
      - --rps=${LOAD_RPS:-0.2}
    depends_on:
      app:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --enable-feature=exemplar-storage
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./deploy/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  tempo:
    image: grafana/tempo:2.8.2
    # Tempo's image runs as a non-root user that can't write to a new named volume.
    user: "0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/tempo.yaml:/etc/tempo.yaml:ro
      - tempo:/var/tempo

  loki:
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/loki.yaml:/etc/loki/config.yaml:ro
      - loki:/loki

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Trace and log links open in Explore, which plain viewers can't use otherwise.
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fal-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  budget:
  prometheus:
  tempo:
  loki:
  grafana:
